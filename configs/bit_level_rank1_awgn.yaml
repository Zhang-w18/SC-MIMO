# bit-level v0 快速验证配置
# 说明：这是纯 NumPy bit-level toy backend，不依赖 Sionna/TensorFlow。
# 当前只支持 rank=1、单 CW、fixed MCS。

antenna:
  bs_n_antennas: 1
  ue_n_antennas: 1

resource:
  n_prbs: 6
  pdsch_n_symbols: 4
  reserve_dmrs_re: false

channel:
  model: "AWGN"        # 可选 AWGN / Rayleigh
  n_re_samples: 1

mapping:
  scheme: "flexible_cw"
  scheme_id: 1
  rank: 1

simulation:
  backend: "numpy_bit_level"
  fixed_mcs: 2          # 建议先用低 MCS 验证瀑布曲线
  snr_range_db: [0, 16, 2]
  n_trials_per_snr: 200
  batch_size: 20
  seed: 7
  output_dir: "./results_bit_level"
  mcs_table: "nr_64qam"

comparison:
  enabled: false

receiver:
  detector: "hard_qam"
  sic_enabled: false

debug:
  verbose: true
