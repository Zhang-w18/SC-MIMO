# Sionna LDPC bit-level v2.2 最小验证配置
# 真实 5G NR LDPC 编解码 + QAM + AWGN + bit comparison
# 当前限制：rank=1、单 CW、fixed MCS、AWGN。

antenna:
  bs_n_antennas: 1
  ue_n_antennas: 1

resource:
  n_prbs: 6
  pdsch_n_symbols: 4
  reserve_dmrs_re: false

channel:
  model: "AWGN"
  n_re_samples: 1

mapping:
  scheme: "flexible_cw"
  scheme_id: 1
  rank: 1

simulation:
  backend: "sionna_ldpc_bit_level"
  mcs_table: "nr_64qam"
  fixed_mcs: 3
  snr_range_db: [-8, 4, 1]
  n_trials_per_snr: 1000
  batch_size: 256
  seed: 7
  output_dir: "./results_sionna_ldpc"

comparison:
  enabled: false

receiver:
  detector: "soft_demapper_ldpc"
  sic_enabled: false
  max_ldpc_iterations: 20

debug:
  verbose: true
